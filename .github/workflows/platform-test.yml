name: test

on:
  push:
    branches:
      - main
    tags:
      - "*-[0-9]+.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Start MinIO Server
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d -p 9000:9000 --name minio \
            -e "MINIO_ROOT_USER=minioadmin" \
            -e "MINIO_ROOT_PASSWORD=minioadmin" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          # wait until it's ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become ready"; docker logs minio; exit 1
      - name: Install blosc (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pip install blosc --no-input --target src/test/resources
          mv src/test/resources/bin/* src/test/resources
      - name: Install blosc (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install blosc --no-input --target src/test/resources
          mv src/test/resources/lib64/* src/test/resources
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'maven'
      - name: Maven Test
        if: matrix.os == 'ubuntu-latest'
        run: mvn -B clean test --file pom.xml
        env:
          AWS_REGION: us-east-1
      - name: Maven Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: mvn -B clean test --file pom.xml -DexcludedGroups=org.janelia.saalfeldlab.n5.universe.storage.AmazonTest
        env:
          AWS_REGION: us-east-1
